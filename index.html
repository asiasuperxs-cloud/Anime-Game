<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena 3D</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #12141c; color: #fff; font-family: system-ui, "Noto Sans Thai", sans-serif; }
  canvas { display: block; }
  .hidden { display: none !important; }

  #hud { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 16px; pointer-events: none; }
  .bar { flex: 1; } .bar.right { text-align: right; }
  .bar .name { font-weight: 700; letter-spacing: .04em; margin-bottom: 4px; }
  .track { height: 18px; background: #3a1020; border: 2px solid #fff; border-radius: 4px; overflow: hidden; }
  .bar.right .track { transform: scaleX(-1); }
  .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ffd166, #06d6a0); transition: width .15s; }
  #timer { font-size: 36px; font-weight: 800; min-width: 60px; text-align: center; }

  button { font: inherit; color: #fff; background: #12141c; border: 1px solid #3a3f55; border-radius: 8px; padding: 10px; }
  #select { position: fixed; inset: 0; pointer-events: none; }
  #select > * { pointer-events: auto; }
  .sel-title { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 900; letter-spacing: .08em; text-shadow: 0 3px 0 #ff3c6e; pointer-events: none; }
  .sel-mode { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .sel-mode button { width: auto; margin: 0; padding: 6px 14px; font-size: 14px; cursor: pointer; background: #1d2030cc; }
  .sel-mode button.on { background: #ff3c6e; border-color: #ff3c6e; font-weight: 700; }
  .side { position: absolute; top: 108px; left: 16px; width: 270px; max-height: calc(100% - 290px); overflow: auto; background: #1d2030e6; border: 1px solid #3a3f55; border-top: 4px solid var(--c, #888); border-radius: 12px; padding: 14px 16px; }
  .side.right { left: auto; right: 16px; }
  .side .tag { font-size: 12px; font-weight: 800; color: var(--c); letter-spacing: .1em; }
  .side h2 { margin: 2px 0 4px; font-size: 26px; }
  .side p { margin: 0 0 10px; color: #aab; font-size: 13px; }
  .stat { display: grid; grid-template-columns: 70px 1fr 34px; align-items: center; gap: 8px; font-size: 12px; color: #ccd; margin: 4px 0; }
  .stat b { text-align: right; color: #fff; }
  .sb { height: 8px; background: #2b3040; border-radius: 4px; overflow: hidden; }
  .sb div { height: 100%; background: var(--c); }
  .mv { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
  .mv li { display: grid; grid-template-columns: 1fr auto 34px; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid #2b3040; }
  .mv li.hd { color: #889; font-size: 11px; border: 0; }
  .mv em { font-style: normal; text-align: right; color: #ffd166; }
  .mv kbd { margin-left: 2px; }
  .st { margin-top: 10px; font-weight: 700; color: #ffd166; }
  .st.ok { color: #06d6a0; font-size: 18px; } .st.dim { color: #667; }
  .grid { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); display: grid; gap: 10px; width: min(640px, calc(100% - 32px)); }
  .ch { position: relative; margin: 0; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; background: #1d2030e6; border: 2px solid #3a3f55; border-radius: 12px; transition: transform .1s; }
  .ch:hover { transform: translateY(-2px); }
  .ch .face { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 900; background: var(--c); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); }
  .ch .nm { font-size: 14px; font-weight: 700; }
  .ch i { position: absolute; top: -9px; font-style: normal; font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px; display: none; }
  .ch .b1 { left: 6px; background: #ff3c6e; } .ch .b2 { right: 6px; background: #3a86ff; }
  .ch.p1 { border-color: #ff3c6e; } .ch.p1 .b1 { display: block; }
  .ch.p2 { border-color: #3a86ff; } .ch.p2 .b2 { display: block; }
  .ch.p1.p2 { border-color: #c77dff; }
  .ch.lk1, .ch.lk2 { box-shadow: 0 0 0 3px #06d6a0; }
  .meter { height: 6px; margin-top: 4px; background: #222638; border-radius: 3px; overflow: hidden; }
  .bar.right .meter { transform: scaleX(-1); }
  .meter div { height: 100%; width: 0; background: #7bdcff; transition: width .1s; }
  .meter div.full { background: linear-gradient(90deg, #ff3c6e, #ffd166); box-shadow: 0 0 10px #ff3c6e; }
  .gems { position: absolute; top: 18px; right: 16px; font-size: 20px; font-weight: 800; background: #1d2030e6; border: 1px solid #3a3f55; border-radius: 10px; padding: 6px 12px; }
  .ch .lock { display: none; font-size: 11px; color: #ffd166; }
  .ch.locked .face { filter: grayscale(.8) brightness(.6); }
  .ch.locked .lock { display: block; }
  .mv li.ult span:first-child { color: #ff6b8b; font-weight: 700; }
  .st.lk { color: #ffd166; font-size: 14px; }
  #shop { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,6,12,.6); z-index: 6; }
  .shop-card { background: #1d2030; border: 1px solid #3a3f55; border-radius: 14px; padding: 20px 24px; width: min(360px, calc(100% - 32px)); text-align: center; }
  .shop-card h3 { margin: 0 0 8px; font-size: 22px; } .shop-card p { margin: 6px 0; color: #ccd; } .shop-card .warn { color: #ff8fa3; font-size: 13px; }
  .shop-btns { display: flex; gap: 8px; margin-top: 14px; } .shop-btns button { flex: 1; cursor: pointer; }
  #shopYes { background: #ff3c6e; border: 0; font-weight: 700; } #shopYes:disabled { opacity: .35; cursor: not-allowed; }
  .sel-help { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 13px; color: #aab; padding: 0 16px; }
  .sel-help .ready { font-size: 24px; color: #06d6a0; letter-spacing: .1em; }
  kbd { background: #2b3040; border-radius: 4px; padding: 1px 6px; color: #fff; }
  @media (max-width: 760px) {
    .sel-title { font-size: 22px; }
    .side { top: 100px; width: calc(50% - 22px); max-height: 34vh; padding: 10px; }
    .side h2 { font-size: 18px; } .side p, .mv { display: none; }
    .stat { grid-template-columns: 52px 1fr; } .stat b { display: none; }
    .ch .face { width: 40px; height: 40px; font-size: 20px; }
    .sel-help { font-size: 0; } .sel-help .ready { font-size: 20px; }
  }

  #banner { position: fixed; top: 38%; left: 0; right: 0; text-align: center; font-size: 72px; font-weight: 900; letter-spacing: .08em;
            text-shadow: 0 4px 0 #ff3c6e; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #banner small { display: block; font-size: 20px; letter-spacing: 0; text-shadow: none; margin-top: 8px; }

  #checker { position: fixed; left: 16px; bottom: 16px; max-width: min(640px, calc(100% - 32px)); font-size: 13px; z-index: 5; }
  #checker button { width: auto; margin: 0; padding: 8px 12px; cursor: pointer; font-size: 13px; }
  #checker.good button { border-color: #06d6a0; } #checker.warn button { border-color: #ffd166; } #checker.bad button { border-color: #ff3c6e; background: #3a1020; }
  #checker ul { display: none; list-style: none; margin: 6px 0 0; padding: 10px; background: #1d2030ee; border-radius: 8px; max-height: 40vh; overflow: auto; }
  #checker.open ul { display: block; }
  #checker li { padding: 6px 0; border-bottom: 1px solid #2b3040; }
  #checker li.error b { color: #ff3c6e; } #checker li.warn b { color: #ffd166; }
  #checker .fix { color: #9fe8c9; margin-top: 2px; }
</style>
</head>
<body>
  <div id="hud" class="hidden">
    <div class="bar"><div class="name" id="n1">P1</div><div class="track"><div class="fill" id="hp1"></div></div><div class="meter"><div id="mt1"></div></div></div>
    <div id="timer">99</div>
    <div class="bar right"><div class="name" id="n2">P2</div><div class="track"><div class="fill" id="hp2"></div></div><div class="meter"><div id="mt2"></div></div></div>
  </div>

  <div id="select">
    <div class="sel-title">เลือกตัวละคร</div>
    <div class="sel-mode"><button id="modeCpu" class="on">1P vs CPU</button><button id="modeVs">1P vs 2P</button></div>
    <div class="side" id="side1"></div>
    <div class="side right" id="side2"></div>
    <div class="grid" id="grid"></div>
    <div class="sel-help" id="selHelp"></div>
    <div class="gems" id="gems">💎 0</div>
    <div id="shop" class="hidden"><div class="shop-card"><div id="shopBody"></div><div class="shop-btns"><button id="shopYes">แลกเลย (F)</button><button id="shopNo">ยกเลิก (G)</button></div></div></div>
  </div>

  <div id="banner"></div>
  <div id="checker"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="validator.js"></script>
  <script src="models.js"></script>
  <script>
    window.__charErr = null;
    window.addEventListener('error', function (e) {
      if (e.filename && e.filename.indexOf('characters.js') !== -1) window.__charErr = { msg: e.message, line: e.lineno };
    });
  </script>
  <script src="characters.js"></script>
  <script src="game.js"></script>
</body>
</html>
